# Her push ve pull request'te GUT testlerini headless çalıştırır.
name: Testler

on:
  push:
  pull_request:

env:
  # Yerel geliştirme ortamıyla aynı sürüm (bkz. project.godot)
  GODOT_VERSION: 4.4.1

jobs:
  gut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Godot önbelleği
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Godot'yu indir
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Projeyi içe aktar
        # Temiz klonda gerekli; yoksa GUT sınıfları bulunamaz ve testler çalışmadan 0 ile çıkar.
        run: ~/godot/godot --headless --import

      - name: Testleri çalıştır
        run: |
          set -o pipefail
          ~/godot/godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit | tee gut-output.txt
          # Ek güvence: hiçbir test çalışmadıysa da başarısız say.
          grep -q "All tests passed" gut-output.txt
